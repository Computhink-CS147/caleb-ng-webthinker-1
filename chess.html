<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Red vs Blue Chess</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #171923;
        color: #f7f4ed;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 720px);
        text-align: center;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        margin: 0 auto;
        border: 1px solid #596273;
        border-radius: 8px;
        touch-action: manipulation;
      }

      button {
        margin: 14px 0 8px;
        padding: 10px 20px;
        border: 0;
        border-radius: 6px;
        background: #ffd166;
        color: #171923;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      a {
        color: #8fc4ff;
      }

      @media (max-width: 520px) {
        body {
          padding: 8px;
        }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.26.5/planck.min.js"></script>
    <script>window._p5play_gtagged = false;</script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.26.5/p5play.js"></script>
    <script src="chess.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Red vs Blue Chess</h1>
      <div id="game"></div>
      <button type="button" onclick="startNewGame()">New Game</button>
      <p><a href="index.html">Back to homepage</a></p>
    </main>
  </body>
</html>
